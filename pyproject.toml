[project]
name = "rendernote"
version = "0.1.0"
description = "Prepare each part of a LilyPond score for live play-along, with the audio of the whole piece to follow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
lilypond = ["lilypond"]

[project.scripts]
rendernote = "rendernote.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rendernote"]

[tool.setuptools.package-data]
rendernote = ["page.html", "player.js", "rendernote.ily"]
