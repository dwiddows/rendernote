<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #f6f4ee; --ink: #232421; --muted: #6b6960; --line: #d9d6cc; --accent: #1b7f8c; --on: #d0021b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: .6rem 1rem; display: grid; gap: .5rem; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; }
  h1 { font-size: 1.1rem; margin: 0 .4rem 0 0; }
  button, select, input { font: inherit; }
  button { padding: .4rem .85rem; border-radius: .45rem; border: 1px solid #b9b6ad; background: white; color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; min-width: 5.5rem; }
  .tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: white; }
  #where { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 7rem; }
  details > summary { cursor: pointer; color: var(--muted); }
  .settings { display: grid; gap: .6rem; padding: .6rem 0 .2rem; }
  .settings label { display: inline-flex; align-items: center; gap: .4rem; }
  .mixer { display: grid; grid-template-columns: auto 1fr auto auto; gap: .3rem .6rem; align-items: center; max-width: 34rem; }
  .mixer button { padding: .15rem .55rem; }
  .mixer button[aria-pressed="true"] { background: var(--ink); color: white; }
  input[type=range] { width: 9rem; }
  input[type=number] { width: 4rem; }
  main { max-width: 1100px; margin: 0 auto; padding: .5rem; }
  .view svg { display: block; width: 100%; height: auto; background: white; }
  .rn-note { cursor: pointer; }
  .rn-note.on path, .rn-note.on { fill: var(--on); }
  footer { max-width: 1100px; margin: 1rem auto 2rem; padding: 0 1rem; color: var(--muted); font-size: .9rem; }
  footer ul { padding-left: 1.2rem; }
  footer pre { white-space: pre-wrap; font-size: .8rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>{{TITLE}}</h1>
    <div class="row tabs" id="tabs"></div>
  </div>
  <div class="row">
    <button class="primary" id="play">Play</button>
    <button id="from-top">From the top</button>
    <span id="where">Tap a note to play from it</span>
  </div>
  <details id="settings-box">
    <summary>Tempo, mixer, click, loop</summary>
    <div class="settings">
      <div class="row">
        <label>Tempo <input type="range" id="tempo" min="40" max="150" step="5"> <span id="tempo-out"></span></label>
      </div>
      <div class="mixer" id="mixer"></div>
      <div class="row">
        <label>Click <select id="click">
          <option value="off">Count-in only</option>
          <option value="bar">First beat of each bar</option>
          <option value="beat">Every beat</option>
        </select></label>
        <label>Volume <input type="range" id="click-vol" min="0" max="100" step="5"></label>
        <label>Count-in <select id="count-in">
          <option value="0">None</option><option value="1">1 bar</option>
          <option value="2">2 bars</option><option value="4">4 bars</option>
        </select></label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="loop-on"> Loop bars</label>
        <input type="number" id="loop-from" min="1"> to <input type="number" id="loop-to" min="1">
      </div>
    </div>
  </details>
</header>
<main>
{{VIEWS}}
</main>
<footer>
  <p>Download: <span id="files"></span></p>
  <p id="version"></p>
  <details><summary>About and licences</summary>
    <p>Made with <a href="https://github.com/dwiddows/rendernote">RenderNote</a> and <a href="https://lilypond.org">LilyPond</a>.</p>
    <pre>{{LICENCES}}</pre>
  </details>
</footer>
<script id="rn-data" type="application/json">{{DATA}}</script>
<script>
{{PLAYER}}
</script>
</body>
</html>
